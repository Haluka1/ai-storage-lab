kvstore:
  metadata_db: "/tmp/ai-inference-storage-showcase-kv/metadata.sqlite3"

tiers:
  memory:
    enabled: true
    max_bytes: 16777216
  nvme:
    enabled: true
    root_dir: "/tmp/ai-inference-storage-showcase-kv/files"
    max_bytes: 67108864
    fsync_on_store: false
    use_direct_io: false
    layout_mode: "segment"
    segment_bytes: 8388608
  s3:
    enabled: false

cost_model:
  tier_profile_path: ""
  tier_profile_mode: "p95"
  load_benefit_threshold_ms: 5.0
  s3_load_benefit_threshold_ms: 50.0
  slo_budget_guard_ms: 100.0
