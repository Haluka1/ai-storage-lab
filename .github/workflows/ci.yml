name: cpu-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependency
        run: python -m pip install -r requirements-ci.txt
      - name: Build and test all CPU modules
        run: make test
      - name: Run loopback-only Router demo
        run: make demo
      - name: Run repository audits
        run: make audit
      - name: Clean generated outputs
        run: make clean
      - name: Ensure tests did not rewrite the checkout
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"
