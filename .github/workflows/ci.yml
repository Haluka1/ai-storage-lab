name: cpu-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: CPU test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install test dependency
        run: python -m pip install -r requirements-ci.txt
      - name: Build and test all CPU modules
        run: make test
      - name: Run loopback-only demos
        run: make demos
      - name: Run repository audits
        run: make audit
      - name: Clean generated outputs
        run: make clean
      - name: Ensure tests did not rewrite the checkout
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"
